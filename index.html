<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball</title>
<style>
  body {
    margin: 0;
    background: #0a1a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    color: #eee;
  }
  canvas {
    border: 2px solid #333;
    border-radius: 6px;
    background: #4a9a3a;
  }
  #hint {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>
  <canvas id="game" width="800" height="560"></canvas>
  <div id="hint">Press SPACE to swing &middot; any other key for next pitch</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Positions (pitcher top, batter bottom)
const PITCHER = { x: 400, y: 110 };
const PLATE   = { x: 400, y: 470 };
const BATTER  = { x: 470, y: 450 };       // right-handed, stands right of plate
const ZONE    = { x: 365, y: 380, w: 70, h: 60 };

// Game state
const G = {
  phase: 'ready',   // ready | pitching | result
  balls: 0,
  strikes: 0,
  ballT: 0,
  ballEnd: null,
  inZone: false,
  swingT: -1,
  result: '',
  resultTimer: 0,
  hit: null,
};

// ---- Field ----
function drawField() {
  // outfield grass
  ctx.fillStyle = '#4a9a3a';
  ctx.fillRect(0, 0, W, H);

  // outfield arc (darker grass bands for depth)
  ctx.fillStyle = '#55a544';
  ctx.beginPath();
  ctx.ellipse(PLATE.x, PLATE.y, 520, 430, 0, Math.PI, 0);
  ctx.fill();

  // infield dirt (diamond-ish)
  ctx.fillStyle = '#c68a4a';
  ctx.beginPath();
  ctx.moveTo(PLATE.x, PLATE.y + 10);
  ctx.lineTo(PLATE.x - 200, PLATE.y - 180);
  ctx.lineTo(PLATE.x, PLATE.y - 340);
  ctx.lineTo(PLATE.x + 200, PLATE.y - 180);
  ctx.closePath();
  ctx.fill();

  // infield grass (inner)
  ctx.fillStyle = '#4a9a3a';
  ctx.beginPath();
  ctx.moveTo(PLATE.x, PLATE.y - 30);
  ctx.lineTo(PLATE.x - 140, PLATE.y - 180);
  ctx.lineTo(PLATE.x, PLATE.y - 300);
  ctx.lineTo(PLATE.x + 140, PLATE.y - 180);
  ctx.closePath();
  ctx.fill();

  // bases (small white squares)
  ctx.fillStyle = '#fff';
  [[-200, -180], [0, -340], [200, -180]].forEach(([dx, dy]) => {
    ctx.save();
    ctx.translate(PLATE.x + dx, PLATE.y + dy);
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-8, -8, 16, 16);
    ctx.restore();
  });

  // pitcher's mound
  ctx.fillStyle = '#b57a3a';
  ctx.beginPath();
  ctx.ellipse(PITCHER.x, PITCHER.y + 10, 55, 38, 0, 0, Math.PI * 2);
  ctx.fill();
  // rubber
  ctx.fillStyle = '#fff';
  ctx.fillRect(PITCHER.x - 16, PITCHER.y + 4, 32, 4);

  // home plate
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(PLATE.x - 18, PLATE.y + 8);
  ctx.lineTo(PLATE.x + 18, PLATE.y + 8);
  ctx.lineTo(PLATE.x + 18, PLATE.y);
  ctx.lineTo(PLATE.x, PLATE.y - 10);
  ctx.lineTo(PLATE.x - 18, PLATE.y);
  ctx.closePath();
  ctx.fill();

  // batter's boxes
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(PLATE.x + 22, PLATE.y - 28, 46, 74);
  ctx.strokeRect(PLATE.x - 68, PLATE.y - 28, 46, 74);

  // foul lines (from plate up-left and up-right toward outfield)
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(PLATE.x, PLATE.y);
  ctx.lineTo(-30, -30);
  ctx.moveTo(PLATE.x, PLATE.y);
  ctx.lineTo(W + 30, -30);
  ctx.stroke();
}

// ---- Strike zone ----
function drawStrikeZone() {
  ctx.fillStyle = 'rgba(255, 255, 100, 0.15)';
  ctx.fillRect(ZONE.x, ZONE.y, ZONE.w, ZONE.h);
  ctx.strokeStyle = 'rgba(255, 255, 100, 0.85)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 3]);
  ctx.strokeRect(ZONE.x, ZONE.y, ZONE.w, ZONE.h);
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,100,0.75)';
  ctx.font = '11px system-ui';
  ctx.fillText('STRIKE ZONE', ZONE.x - 2, ZONE.y - 6);
}

// ---- Pitcher (top-down, facing down the screen) ----
function drawPitcher() {
  const x = PITCHER.x, y = PITCHER.y;

  // Arm angle — in screen space.
  //   -PI/2 = pointing up (windup back), +PI/2 = pointing down (toward plate)
  let armAngle = 0;                  // neutral: to the side
  if (G.phase === 'pitching') {
    if (G.ballT < 0.15) {
      // wind back (rotate up)
      armAngle = lerp(0, -Math.PI / 2, G.ballT / 0.15);
    } else if (G.ballT < 0.3) {
      // whip forward (down)
      armAngle = lerp(-Math.PI / 2, Math.PI / 2, (G.ballT - 0.15) / 0.15);
    } else {
      armAngle = Math.PI / 2; // follow through, arm extended down
    }
  }

  // body (torso) — oval seen from above
  ctx.fillStyle = '#2a4a8a';
  ctx.beginPath();
  ctx.ellipse(x, y, 18, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  // jersey number patch
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('17', x, y + 4);
  ctx.textAlign = 'left';

  // glove arm (static, sticking out to the pitcher's other side)
  ctx.strokeStyle = '#2a4a8a';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 14, y);
  ctx.lineTo(x - 32, y + 8);
  ctx.stroke();
  ctx.fillStyle = '#7a4820';
  ctx.beginPath();
  ctx.arc(x - 34, y + 10, 7, 0, Math.PI * 2);
  ctx.fill();

  // throwing arm
  const shX = x + 14, shY = y;
  const handX = shX + Math.cos(armAngle) * 32;
  const handY = shY + Math.sin(armAngle) * 32;
  ctx.strokeStyle = '#2a4a8a';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(shX, shY);
  ctx.lineTo(handX, handY);
  ctx.stroke();

  // head (with cap) — drawn on top of body
  ctx.fillStyle = '#f4c891';
  ctx.beginPath();
  ctx.arc(x, y - 8, 13, 0, Math.PI * 2);
  ctx.fill();
  // cap (dome + brim pointing down toward plate)
  ctx.fillStyle = '#2a4a8a';
  ctx.beginPath();
  ctx.arc(x, y - 8, 13, 0, Math.PI * 2);
  ctx.fill();
  // brim
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // cap logo
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('P', x, y - 5);
  ctx.textAlign = 'left';

  // ball in hand before release
  if (G.phase !== 'pitching' || G.ballT < 0.3) {
    drawBall(handX, handY, 5);
  }
}

// ---- Batter (top-down, stands right of plate facing plate) ----
function drawBatter() {
  const x = BATTER.x, y = BATTER.y;

  // Bat angle — right-handed batter holds bat up-back-right,
  //   sweeps forward across the plate (screen: right → up → left).
  //   rest: -PI/4 (up-right), through -PI/2 (up), to -3PI/4 (up-left).
  let batAngle;
  if (G.swingT < 0) {
    batAngle = -Math.PI / 4;
  } else {
    batAngle = lerp(-Math.PI / 4, -Math.PI * 1.1, G.swingT);
  }

  // body (torso) from above
  ctx.fillStyle = '#c22';
  ctx.beginPath();
  ctx.ellipse(x, y, 16, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  // jersey stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 2, y - 14, 4, 28);

  // head + helmet (from above)
  ctx.fillStyle = '#f4c891';
  ctx.beginPath();
  ctx.arc(x, y - 10, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(x, y - 10, 12, 0, Math.PI * 2);
  ctx.fill();
  // helmet ear flap (points toward pitcher — forward = up)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(x - 4, y - 16, 4, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // hands (near body, toward the back shoulder)
  const handX = x + 6;
  const handY = y - 6;

  // arms
  ctx.strokeStyle = '#c22';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y - 5);
  ctx.lineTo(handX, handY);
  ctx.stroke();

  // bat
  const batLen = 70;
  const batEndX = handX + Math.cos(batAngle) * batLen;
  const batEndY = handY + Math.sin(batAngle) * batLen;

  // bat body — tapered by drawing two strokes
  ctx.strokeStyle = '#5a3010';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(handX, handY);
  ctx.lineTo(handX + Math.cos(batAngle) * 20, handY + Math.sin(batAngle) * 20);
  ctx.stroke();

  ctx.strokeStyle = '#a66a32';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(handX + Math.cos(batAngle) * 18, handY + Math.sin(batAngle) * 18);
  ctx.lineTo(batEndX, batEndY);
  ctx.stroke();
}

// ---- Ball helpers ----
function drawBall(x, y, r) {
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#c33';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// Pitch ball: falls from pitcher's hand toward target
function drawPitchBall() {
  if (G.phase !== 'pitching' || G.ballT < 0.3 || !G.ballEnd) return;
  const t = (G.ballT - 0.3) / 0.7;
  const sx = PITCHER.x + 30, sy = PITCHER.y + 30;
  const ex = G.ballEnd.x, ey = G.ballEnd.y;
  const x = sx + (ex - sx) * t;
  const y = sy + (ey - sy) * t;

  // shadow on ground grows (subtle 3D feel)
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, ey + 20, 6 + t * 3, 2 + t, 0, 0, Math.PI * 2);
  ctx.fill();

  // slight size growth toward plate
  const size = 5 + t * 3;
  drawBall(x, y, size);
}

// Hit ball: arcs from plate toward outfield (upward on screen)
function drawHitBall() {
  if (!G.hit) return;
  const t = Math.min(1, G.hit.t);
  const sx = PLATE.x, sy = PLATE.y - 10;
  const ex = G.hit.x, ey = G.hit.y;
  // arc peaks between start and end (negative y = higher arc)
  const peakY = Math.min(sy, ey) - 160;
  const peakX = (sx + ex) / 2;

  const bx = (ti) => (1 - ti) * (1 - ti) * sx + 2 * (1 - ti) * ti * peakX + ti * ti * ex;
  const by = (ti) => (1 - ti) * (1 - ti) * sy + 2 * (1 - ti) * ti * peakY + ti * ti * ey;

  // trail
  for (let i = 6; i >= 1; i--) {
    const ti = Math.max(0, t - i * 0.05);
    ctx.globalAlpha = (7 - i) / 14;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(bx(ti), by(ti), 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawBall(bx(t), by(t), 6);

  // landing marker
  if (t >= 1) {
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(ex, ey, 18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 16px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(G.hit.type, ex, ey - 26);
    ctx.textAlign = 'left';
  }
}

// ---- Scoreboard ----
function drawScoreboard() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(10, 10, 190, 76);
  ctx.strokeStyle = '#555';
  ctx.strokeRect(10, 10, 190, 76);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px system-ui';
  ctx.fillText('COUNT', 22, 30);

  ctx.fillStyle = '#ccc';
  ctx.font = '12px system-ui';
  ctx.fillText('B', 22, 54);
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(42 + i * 20, 50, 7, 0, Math.PI * 2);
    ctx.fillStyle = i < G.balls ? '#2f2' : '#333';
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.fillStyle = '#ccc';
  ctx.fillText('S', 22, 76);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(42 + i * 20, 72, 7, 0, Math.PI * 2);
    ctx.fillStyle = i < G.strikes ? '#f33' : '#333';
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ---- Result banner ----
function drawResult() {
  if (!G.result || G.resultTimer <= 0) return;
  const colors = {
    'STRIKE!': '#f33',
    'BALL!': '#3f3',
    'HIT!': '#ff0',
    'FOUL!': '#f80',
    'MISS!': '#f66',
    'STRIKEOUT': '#f33',
    'WALK': '#3f3',
  };
  ctx.save();
  ctx.globalAlpha = Math.min(1, G.resultTimer / 30);
  ctx.font = 'bold 52px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillText(G.result, W / 2 + 3, 260 + 3);
  ctx.fillStyle = colors[G.result] || '#fff';
  ctx.fillText(G.result, W / 2, 260);
  ctx.textAlign = 'left';
  ctx.restore();
}

// ---- Game logic ----
function lerp(a, b, t) { return a + (b - a) * t; }

function startPitch() {
  const inZone = Math.random() < 0.65;
  let ex, ey;
  if (inZone) {
    ex = ZONE.x + Math.random() * ZONE.w;
    ey = ZONE.y + Math.random() * ZONE.h;
  } else {
    const side = Math.floor(Math.random() * 4);
    if (side === 0)      { ex = ZONE.x + Math.random() * ZONE.w; ey = ZONE.y - 20 - Math.random() * 30; }
    else if (side === 1) { ex = ZONE.x + Math.random() * ZONE.w; ey = ZONE.y + ZONE.h + 10 + Math.random() * 30; }
    else if (side === 2) { ex = ZONE.x - 25 - Math.random() * 30; ey = ZONE.y + Math.random() * ZONE.h; }
    else                 { ex = ZONE.x + ZONE.w + 15 + Math.random() * 30; ey = ZONE.y + Math.random() * ZONE.h; }
  }
  G.ballEnd = { x: ex, y: ey };
  G.inZone = inZone;
  G.phase = 'pitching';
  G.ballT = 0;
  G.swingT = -1;
  G.hit = null;
  G.result = '';
  G.resultTimer = 0;
}

function swing() {
  if (G.phase !== 'pitching' || G.swingT >= 0) return;
  G.swingT = 0;
}

function resolve() {
  const swung = G.swingT >= 0;

  if (swung) {
    const goodTiming = G.swingT > 0.35 && G.swingT < 0.85;

    if (goodTiming && G.inZone) {
      // Fair territory = upward cone from home plate, roughly ±45°
      //   straight up = angle -PI/2; spread ±PI/4
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * (Math.PI / 2);
      const dist = 180 + Math.random() * 260;
      const hx = PLATE.x + Math.cos(angle) * dist;
      const hy = PLATE.y + Math.sin(angle) * dist;

      let type = 'SINGLE';
      const r = Math.random();
      if (dist > 380) type = 'HOME RUN!';
      else if (r > 0.85) type = 'TRIPLE';
      else if (r > 0.55) type = 'DOUBLE';
      G.hit = { x: hx, y: hy, type, t: 0 };
      G.result = 'HIT!';
      G.balls = 0;
      G.strikes = 0;
    } else {
      // mistimed or out-of-zone swing
      if (Math.random() < 0.25 && G.inZone) {
        // foul ball — lands off to the side
        const side = Math.random() < 0.5 ? -1 : 1;
        const hx = PLATE.x + side * (180 + Math.random() * 120);
        const hy = PLATE.y - (60 + Math.random() * 180);
        G.hit = { x: hx, y: hy, type: 'FOUL', t: 0 };
        G.result = 'FOUL!';
        if (G.strikes < 2) G.strikes++;
      } else {
        G.result = 'MISS!';
        G.strikes++;
      }
    }
  } else {
    if (G.inZone) {
      G.result = 'STRIKE!';
      G.strikes++;
    } else {
      G.result = 'BALL!';
      G.balls++;
    }
  }

  if (G.strikes >= 3) {
    G.result = 'STRIKEOUT';
    G.strikes = 0;
    G.balls = 0;
  } else if (G.balls >= 4) {
    G.result = 'WALK';
    G.strikes = 0;
    G.balls = 0;
  }

  G.resultTimer = 90;
  G.phase = 'result';
}

// ---- Main loop ----
function update() {
  if (G.phase === 'pitching') {
    G.ballT += 0.018;
    if (G.swingT >= 0) G.swingT += 0.05;
    if (G.ballT >= 1) {
      G.ballT = 1;
      resolve();
    }
  } else if (G.phase === 'result') {
    if (G.resultTimer > 0) G.resultTimer--;
    if (G.hit) G.hit.t = Math.min(1, G.hit.t + 0.022);
  }
}

function draw() {
  drawField();
  drawStrikeZone();
  drawHitBall();       // under figures so marker doesn't cover them
  drawPitcher();
  drawPitchBall();
  drawBatter();
  drawScoreboard();
  drawResult();

  if (G.phase === 'ready') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(W / 2 - 150, H - 40, 300, 28);
    ctx.fillStyle = '#fff';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Press any key to pitch', W / 2, H - 21);
    ctx.textAlign = 'left';
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ---- Input ----
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (G.phase === 'pitching') swing();
    else if (G.phase === 'ready' || (G.phase === 'result' && G.resultTimer < 30)) startPitch();
  } else {
    if (G.phase === 'ready' || (G.phase === 'result' && G.resultTimer < 30)) startPitch();
  }
});

canvas.addEventListener('click', () => {
  if (G.phase === 'pitching') swing();
  else if (G.phase === 'ready' || (G.phase === 'result' && G.resultTimer < 30)) startPitch();
});

loop();
</script>
</body>
</html>
